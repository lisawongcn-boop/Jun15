<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spark — Dating Chat Bot</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <div class="app">
      <section id="match-screen" class="screen active">
        <header class="header">
          <h1>Spark</h1>
          <p>Practice dating conversations with AI personas</p>
        </header>
        <div id="persona-list" class="persona-list"></div>
      </section>

      <section id="chat-screen" class="screen">
        <header class="header">
          <div class="chat-header">
            <button id="back-btn" class="back-btn" aria-label="Back">←</button>
            <div id="chat-avatar" class="avatar"></div>
            <div class="chat-header-info">
              <h2 id="chat-name"></h2>
              <p id="chat-status">Online now</p>
            </div>
          </div>
        </header>

        <div id="messages" class="messages"></div>
        <div id="typing" class="typing" aria-hidden="true">
          <span></span><span></span><span></span>
        </div>

        <div id="icebreakers" class="icebreakers"></div>

        <form id="composer" class="composer">
          <input
            id="message-input"
            type="text"
            placeholder="Say something charming..."
            autocomplete="off"
            maxlength="1000"
          />
          <button type="submit" id="send-btn" aria-label="Send">➤</button>
        </form>

        <div id="status-bar" class="status-bar"></div>
      </section>
    </div>

    <script src="/static/app.js"></script>
  </body>
</html>
