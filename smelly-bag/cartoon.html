<title>Smelly Bag</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chewy&family=Fredoka:wght@400;500;600&display=swap">
<style>
:root{
  color-scheme: light;
  --page:#f1e9fb; --ink:#2a1f3d; --muted:#6d5f86; --plum:#6b3fa0; --plum-ink:#fff;
  --card:#ffffff; --line:#dccdf2; --hi:#fbe7a6;
  --display:"Chewy","Comic Sans MS","Chalkboard SE",cursive;
  --body:"Fredoka","Trebuchet MS",system-ui,sans-serif;
}
*{box-sizing:border-box}
body{background:var(--page);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
.wrap{max-width:980px;margin:0 auto;padding-inline:16px;padding-block:28px 56px}
header{display:flex;flex-direction:column;gap:6px;margin-bottom:22px}
.eyebrow{margin:0;font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;color:var(--plum);font-weight:600}
h1{margin:0;font-family:var(--display);font-weight:400;font-size:clamp(2.6rem,8vw,4rem);line-height:1;color:var(--plum);letter-spacing:.01em}
.lede{margin:0;color:var(--muted);max-width:52ch}
.layout{display:grid;grid-template-columns:minmax(0,400px) minmax(0,1fr);gap:32px;align-items:start}
@media (max-width:760px){.layout{grid-template-columns:1fr}}
.player{display:flex;flex-direction:column;gap:12px}
.screen{position:relative;width:100%;max-width:400px;aspect-ratio:9/16;border-radius:22px;overflow:hidden;background:#2a1f3d;box-shadow:0 18px 40px -22px rgba(60,30,100,.6)}
.screen svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.cap{position:absolute;left:6%;right:6%;bottom:5%;text-align:center;font-family:var(--display);font-size:clamp(1.25rem,5.6vw,1.7rem);line-height:1.12;color:#fff;-webkit-text-stroke:6px #5a2f8c;paint-order:stroke fill;text-wrap:balance;pointer-events:none;transition:opacity .2s}
.cap:empty{opacity:0}
.big-play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-family:var(--display);font-size:1.6rem;padding:14px 30px;border-radius:999px;border:0;background:var(--plum);color:var(--plum-ink);cursor:pointer;box-shadow:0 8px 0 #4b2877}
.big-play:hover{filter:brightness(1.08)}
.big-play:focus-visible,.controls button:focus-visible,.bar:focus-visible,.lyr button:focus-visible{outline:3px solid #f0b43c;outline-offset:3px}
.controls{display:flex;flex-wrap:wrap;align-items:center;gap:8px;max-width:400px}
.controls button{font-family:var(--body);font-weight:600;font-size:.92rem;padding:8px 14px;border-radius:999px;border:2px solid var(--plum);background:var(--card);color:var(--plum);cursor:pointer}
.controls button.primary{background:var(--plum);color:var(--plum-ink)}
.bar{flex:1 1 100%;height:10px;border-radius:999px;background:var(--line);cursor:pointer;position:relative;order:5}
.bar div{position:absolute;inset:0 auto 0 0;border-radius:999px;background:var(--plum);width:0}
.time{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--muted);font-size:.9rem}
.lyrics h2{margin:0 0 10px;font-family:var(--display);font-weight:400;font-size:1.6rem;color:var(--plum)}
.lyr{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.lyr li.sec{margin-top:12px;font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600;padding-left:12px}
.lyr li.sec:first-child{margin-top:0}
.lyr button{all:unset;display:block;width:100%;box-sizing:border-box;padding:6px 12px;border-radius:10px;cursor:pointer;color:var(--ink)}
.lyr button:hover{background:#e7dbf7}
.lyr button.on{background:var(--hi);font-weight:600}
.note{margin-top:18px;font-size:.88rem;color:var(--muted);max-width:52ch}
@media (prefers-reduced-motion: reduce){.cap{transition:none}}
</style>

<div class="wrap">
  <header>
    <p class="eyebrow">A cartoon sung to the “Smelly Cat” tune</p>
    <h1>Smelly Bag</h1>
    <p class="lede">Starring Lisa on guitar, Andreas as the culprit, and one very smelly tote bag.</p>
  </header>
  <div class="layout">
    <section class="player" aria-label="Cartoon player">
      <div class="screen">
        <svg id="stage" viewBox="0 0 360 640" role="img" aria-label="Smelly Bag cartoon"></svg>
        <div class="cap" id="cap" aria-live="polite"></div>
        <button class="big-play" id="bigplay" type="button">▶ Play</button>
      </div>
      <div class="controls">
        <button class="primary" id="play" type="button">Play</button>
        <button id="restart" type="button">Restart</button>
        <button id="mute" type="button" aria-pressed="false">Music on</button>
        <span class="time" id="time">0:00 / 0:00</span>
        <div class="bar" id="bar" role="slider" tabindex="0" aria-label="Position" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div id="prog"></div></div>
      </div>
    </section>
    <section class="lyrics">
      <h2>Lyrics</h2>
      <ol class="lyr" id="lyr"></ol>
      <p class="note">Tap a line to jump to it. The music is a cheerful ukulele strum written for this page; sing the “Smelly Cat” tune over it.</p>
    </section>
  </div>
</div>

<script>
(function(){
const C={ink:'#2a1f3d',cream:'#f6eedb',creamEdge:'#d8c9a4',olive:'#7a8a35',heart:'#e0445a',cheek:'#f4a3a8',stink:'#8fd49c',
  skinL:'#f7d7c0',skinA:'#f3c6a0',hairL:'#7a3322',hairA:'#6a3a1c',navy:'#1e2748',jacket:'#1d1b22',beige:'#eadfb4',shorts:'#27345e'};
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
const easeIn=t=>t*t*t;
const seg=(t,a,b)=>clamp((t-a)/(b-a));
const back=t=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2);};
const rnd=i=>{const x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x);};
const n1=v=>(+v).toFixed(1);
function mix(a,b,t){const p=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));const A=p(a),B=p(b);return '#'+A.map((v,i)=>Math.round(v+(B[i]-v)*t).toString(16).padStart(2,'0')).join('');}
function heart(cx,cy,s,fill=C.heart,op=1){return `<path d="M${cx},${cy+s*.9} C${cx-s*1.6},${cy-s*.2} ${cx-s*.6},${cy-s*1.3} ${cx},${cy-s*.4} C${cx+s*.6},${cy-s*1.3} ${cx+s*1.6},${cy-s*.2} ${cx},${cy+s*.9}Z" fill="${fill}" opacity="${op}"/>`;}
function star(x,y,r,rot=0,fill='#ffe27a',op=1){let p='';for(let i=0;i<8;i++){const a=rot+i*Math.PI/4;const rr=i%2?r*.38:r;p+=(i?'L':'M')+n1(x+Math.cos(a)*rr)+','+n1(y+Math.sin(a)*rr);}return `<path d="${p}Z" fill="${fill}" opacity="${op}"/>`;}
function blink(t,seed=0){const p=(t+seed)%3.4;return p<.12?.12:1;}
function stink(x,y,t,n=3,spread=18,h=46,col=C.stink,w=4){let s='';for(let i=0;i<n;i++){const ph=((t*.55)+i/n)%1;const yy=y-ph*h;const xx=x+(i-(n-1)/2)*spread+Math.sin(t*3+i)*3;const o=Math.sin(ph*Math.PI);s+=`<path d="M${n1(xx)},${n1(yy)} q7,-8 0,-16 q-7,-8 0,-16" stroke="${col}" stroke-width="${w}" fill="none" stroke-linecap="round" opacity="${o.toFixed(2)}"/>`;}return s;}
function fly(x,y,t){const fx=x+Math.cos(t*3.2)*26,fy=y+Math.sin(t*6.4)*10;const w=Math.sin(t*60)>0?1:.5;return `<g transform="translate(${n1(fx)},${n1(fy)})"><ellipse cx="-4" cy="-5" rx="5" ry="${3*w}" fill="#fff" opacity=".85"/><ellipse cx="4" cy="-5" rx="5" ry="${3*w}" fill="#fff" opacity=".85"/><circle r="4.5" fill="#2a2a33"/><circle cx="2" cy="-1" r="1.2" fill="#fff"/></g>`;}
function notes(x,y,t,n=4,col='#d9b8ff',h=130){let s='';for(let i=0;i<n;i++){const ph=((t*.35)+i/n)%1;const xx=x+Math.sin(ph*6+i)*22+(i-n/2)*12;const yy=y-ph*h;s+=`<text x="${n1(xx)}" y="${n1(yy)}" font-size="${20+i%2*8}" fill="${col}" stroke="#5a2f8c" stroke-width="1" opacity="${Math.sin(ph*Math.PI).toFixed(2)}" font-family="serif">${i%2?'♪':'♫'}</text>`;}return s;}
function sparkles(cx,cy,t,n=6,r=80,col='#ffe27a'){let s='';for(let i=0;i<n;i++){const a=i/n*Math.PI*2+t*.4;const rr=r+Math.sin(t*2+i)*8;const tw=.5+.5*Math.sin(t*5+i*1.7);s+=star(cx+Math.cos(a)*rr,cy+Math.sin(a)*rr*.8,5+tw*5,t+i,col,.4+tw*.6);}return s;}

/* ---------- characters ---------- */
function bagEyes(mood,look,t,mask,body){
  if(mask) return `<rect x="-34" y="-72" width="68" height="22" rx="11" fill="#6c4fa3"/><path d="M-24,-61 q8,5 16,0 M8,-61 q8,5 16,0" stroke="#fff" stroke-width="2.5" fill="none" stroke-linecap="round"/>${star(0,-66,4,0)}`;
  let s='';
  for(const ex of [-16,16]){
    if(mood==='happy'||mood==='proud'){s+=`<path d="M${ex-8},-58 q8,-11 16,0" stroke="${C.ink}" stroke-width="3.5" fill="none" stroke-linecap="round"/>`;}
    else if(mood==='dizzy'){s+=`<circle cx="${ex}" cy="-60" r="11" fill="#fff" stroke="${C.ink}" stroke-width="1.5"/><g transform="rotate(${n1(t*320)} ${ex} -60)"><path d="M${ex},-60 m-6,0 a6,6 0 1,1 6,6 a4,4 0 1,1 -4,-4 a2,2 0 1,1 2,2" stroke="${C.ink}" stroke-width="2" fill="none"/></g>`;}
    else if(mood==='smug'){s+=`<circle cx="${ex}" cy="-60" r="10" fill="#fff"/><circle cx="${ex+2}" cy="-58" r="6" fill="${C.ink}"/><rect x="${ex-12}" y="-73" width="24" height="12" fill="${body}"/><path d="M${ex-11},-61 L${ex+11},-61" stroke="${C.ink}" stroke-width="3" stroke-linecap="round"/>`;}
    else{
      const sh=mood==='shocked', r=sh?13:11, pr=sh?4.5:7, b=sh?1:blink(t,.4);
      s+=`<g transform="translate(${ex},-60) scale(1,${b})"><circle r="${r}" fill="#fff" stroke="${C.ink}" stroke-width="1.5"/><circle cx="${look[0]}" cy="${look[1]}" r="${pr}" fill="${C.ink}"/><circle cx="${look[0]+2.5}" cy="${look[1]-2.5}" r="2.2" fill="#fff"/></g>`;
      if(mood==='sad'||mood==='droopy') s+=`<path d="M${ex-9},-78 L${ex+9},-78" stroke="${C.ink}" stroke-width="2.6" stroke-linecap="round" transform="rotate(${ex<0?-15:15} ${ex} -78)"/>`;
      if(mood==='droopy') s+=`<rect x="${ex-12}" y="-73" width="24" height="10" fill="${body}"/><path d="M${ex-11},-63 L${ex+11},-63" stroke="${C.ink}" stroke-width="2.5" stroke-linecap="round"/>`;
    }
  }
  return s;
}
function bagMouth(m){
  if(m==='happy'||m==='proud') return `<path d="M-10,-41 q10,12 20,0Z" fill="#e0707a" stroke="${C.ink}" stroke-width="2.5" stroke-linejoin="round"/>`;
  if(m==='smug') return `<path d="M-9,-40 q12,8 18,-3" stroke="${C.ink}" stroke-width="3" fill="none" stroke-linecap="round"/>`;
  if(m==='shocked') return `<ellipse cx="0" cy="-35" rx="6.5" ry="9" fill="${C.ink}"/>`;
  if(m==='dizzy') return `<path d="M-10,-38 l5,-4 l5,4 l5,-4 l5,4" stroke="${C.ink}" stroke-width="2.5" fill="none" stroke-linecap="round"/>`;
  if(m==='neutral') return `<path d="M-7,-38 q7,4 14,0" stroke="${C.ink}" stroke-width="3" fill="none" stroke-linecap="round"/>`;
  return `<path d="M-8,-33 q8,-8 16,0" stroke="${C.ink}" stroke-width="3" fill="none" stroke-linecap="round"/>`;
}
function bag(x,y,s=1,o={}){
  const {mood='sad',green=0,sx=1,sy=1,rot=0,look=[0,0],tears=0,t=0,plaster=false,damp=false,mask=false,extra=''}=o;
  const body=mix(C.cream,'#c7e6b8',green);
  let f=`<path d="M-26,-96 C-26,-140 -4,-140 -4,-96" stroke="${C.olive}" stroke-width="7" fill="none" stroke-linecap="round"/><path d="M4,-96 C4,-140 26,-140 26,-96" stroke="${C.olive}" stroke-width="7" fill="none" stroke-linecap="round"/>`;
  f+=extra;
  f+=`<path d="M-42,-100 L42,-100 L47,-5 Q47,0 42,0 L-42,0 Q-47,0 -47,-5Z" fill="${body}" stroke="${C.creamEdge}" stroke-width="2.5"/>`;
  f+=`<path d="M-40,-92 L40,-92" stroke="${C.creamEdge}" stroke-width="1.5" stroke-dasharray="4 4"/>`;
  if(damp) f+=`<ellipse cx="-12" cy="-18" rx="18" ry="10" fill="#8fb6c9" opacity=".35"/><ellipse cx="14" cy="-80" rx="8" ry="5" fill="#8fb6c9" opacity=".3"/>`;
  f+=heart(27,-22,7);
  if(plaster) f+=`<g transform="translate(-34,-14) rotate(-30)"><rect x="-11" y="-4.5" width="22" height="9" rx="3.5" fill="#f6b7b0"/><circle cx="-2.5" cy="0" r="1" fill="#d98a82"/><circle cx="2.5" cy="0" r="1" fill="#d98a82"/></g>`;
  f+=`<ellipse cx="-29" cy="-45" rx="7" ry="4" fill="${C.cheek}" opacity=".85"/><ellipse cx="29" cy="-45" rx="7" ry="4" fill="${C.cheek}" opacity=".85"/>`;
  f+=bagEyes(mood,look,t,mask,body)+bagMouth(mood);
  if(tears>0){for(const ex of [-16,16]){const ph=(t*1.1+(ex>0?.5:0))%1;f+=`<path d="M${ex},${n1(-48+ph*32)} q-4.5,6 0,10 q4.5,-4 0,-10Z" fill="#7cc4f0" opacity="${(tears*(1-ph)).toFixed(2)}"/>`;}}
  return `<g transform="translate(${n1(x)},${n1(y)}) rotate(${n1(rot)}) scale(${(s*sx).toFixed(3)},${(s*sy).toFixed(3)})">${f}</g>`;
}
const FLOW=[[-10,-124,'#f2b8c6'],[9,-119,'#f7ecd8'],[-17,-104,'#f7ecd8'],[4,-100,'#f2b8c6'],[19,-92,'#f7ecd8'],[-25,-84,'#f2b8c6'],[-6,-80,'#f7ecd8'],[15,-74,'#f2b8c6'],[-29,-60,'#f7ecd8'],[-12,-56,'#f2b8c6'],[6,-58,'#f7ecd8'],[27,-56,'#f2b8c6'],[-2,-66,'#f2b8c6']];
function lisa(x,y,s=1,o={}){
  const {t=0,mouth='smile',eyes='normal',gRot=-18,strum=true,bob=0}=o;
  const hs=Math.sin(t*2)*1.5;
  let f=`<path d="M-40,-206 C-64,-160 -56,-110 -47,-90 Q0,-83 47,-90 C56,-110 64,-160 40,-206Z" fill="${C.hairL}" transform="rotate(${n1(hs)} 0 -200)"/>`;
  f+=`<rect x="-14" y="-46" width="8" height="36" rx="4" fill="${C.skinL}"/><rect x="6" y="-46" width="8" height="36" rx="4" fill="${C.skinL}"/>`;
  f+=`<path d="M-25,-3 Q-25,-15 -12,-15 L-6,-15 Q-2,-15 -2,-7 L-2,-1 L-25,-1Z" fill="#fff" stroke="#c9c3d6" stroke-width="1.5"/><path d="M25,-3 Q25,-15 12,-15 L6,-15 Q2,-15 2,-7 L2,-1 L25,-1Z" fill="#fff" stroke="#c9c3d6" stroke-width="1.5"/><path d="M-24,-4 H-3 M24,-4 H3" stroke="#e4def0" stroke-width="2"/>`;
  f+=`<path d="M-22,-134 L22,-134 L39,-44 Q0,-35 -39,-44Z" fill="${C.navy}"/>`;
  for(const [fx,fy,c] of FLOW) f+=`<circle cx="${fx}" cy="${fy}" r="2.7" fill="${c}"/><circle cx="${fx}" cy="${fy}" r="1" fill="#f3b04a"/>`;
  f+=`<rect x="-6" y="-160" width="12" height="16" fill="${C.skinL}"/><path d="M-10,-150 L0,-128 L10,-150Z" fill="${C.skinL}"/>`;
  f+=`<path d="M-31,-151 Q-13,-157 -8,-149 L-2,-121 L-4,-102 L-31,-98 Q-35,-125 -31,-151Z" fill="${C.jacket}"/><path d="M31,-151 Q13,-157 8,-149 L2,-121 L4,-102 L31,-98 Q35,-125 31,-151Z" fill="${C.jacket}"/>`;
  f+=`<path d="M-8,-149 L-2,-122 L-15,-135Z" fill="#45414f"/><path d="M8,-149 L2,-122 L15,-135Z" fill="#45414f"/>`;
  const a=gRot*Math.PI/180, rp=(lx,ly)=>[lx*Math.cos(a)-ly*Math.sin(a), -112+lx*Math.sin(a)+ly*Math.cos(a)];
  const sy2=strum?Math.sin(t*13)*6:0;
  f+=`<g transform="translate(0,-112) rotate(${n1(gRot)})"><rect x="14" y="-4" width="76" height="8" rx="2" fill="#5a3a22"/><rect x="86" y="-7.5" width="17" height="15" rx="3" fill="#6b4428"/><circle cx="-9" cy="0" r="22" fill="#dca060" stroke="#a86b35" stroke-width="2"/><circle cx="14" cy="0" r="16" fill="#dca060" stroke="#a86b35" stroke-width="2"/><rect x="-10" y="-19" width="26" height="38" fill="#dca060"/><circle cx="5" cy="0" r="7" fill="#4a2c18"/><rect x="-23" y="-7" width="5" height="14" rx="1" fill="#4a2c18"/><path d="M-20,-2 H90 M-20,2 H90" stroke="#f3e2c6" stroke-width=".7"/></g>`;
  const [hx,hy]=rp(0,sy2-5),[nx,ny]=rp(62,-3);
  f+=`<path d="M-31,-147 Q${n1((hx-31)/2-10)},${n1((hy-147)/2+14)} ${n1(hx)},${n1(hy)}" stroke="${C.jacket}" stroke-width="12" fill="none" stroke-linecap="round"/>`;
  f+=`<path d="M31,-147 Q${n1((nx+31)/2+6)},${n1((ny-147)/2+20)} ${n1(nx)},${n1(ny)}" stroke="${C.jacket}" stroke-width="12" fill="none" stroke-linecap="round"/>`;
  f+=`<circle cx="${n1(hx)}" cy="${n1(hy)}" r="6.5" fill="${C.skinL}"/><circle cx="${n1(nx)}" cy="${n1(ny)}" r="6.5" fill="${C.skinL}"/>`;
  f+=`<circle cx="0" cy="-196" r="42" fill="${C.skinL}"/>`;
  f+=`<path d="M0,-241 C-35,-241 -51,-214 -47,-176 C-45,-150 -45,-120 -41,-98 L-32,-100 C-36,-130 -38,-160 -36,-186 C-32,-212 -16,-226 0,-231Z" fill="${C.hairL}"/><path d="M0,-241 C35,-241 51,-214 47,-176 C45,-150 45,-120 41,-98 L32,-100 C36,-130 38,-160 36,-186 C32,-212 16,-226 0,-231Z" fill="${C.hairL}"/>`;
  f+=`<path d="M-30,-226 q10,-8 20,-7 M14,-233 q9,1 15,6" stroke="#b25a3c" stroke-width="3.5" fill="none" stroke-linecap="round" opacity=".75"/>`;
  f+=`<path d="M-24,-209 q8,-5 15,-1 M9,-210 q8,-4 15,1" stroke="#5a2a1a" stroke-width="2.4" fill="none" stroke-linecap="round"/>`;
  const b=blink(t,1.3);
  for(const ex of [-16,16]){
    const side=eyes==='side'?4:0, dir=ex<0?-1:1;
    f+=`<g transform="translate(${ex},-191) scale(1,${eyes==='side'?1:b})"><ellipse rx="8.5" ry="11" fill="#3b1e14"/><circle cx="${2.5+side}" cy="-4" r="3" fill="#fff"/><circle cx="${-2+side}" cy="4" r="1.4" fill="#fff"/></g>`;
    f+=`<path d="M${ex+dir*6},-200 l${dir*6},-5 M${ex+dir*8},-195 l${dir*7},-2" stroke="#3b1e14" stroke-width="2" stroke-linecap="round"/>`;
    if(eyes==='side') f+=`<rect x="${ex-11}" y="-204" width="22" height="12" fill="${C.skinL}"/><path d="M${ex-10},-192 L${ex+10},-192" stroke="#3b1e14" stroke-width="2.6" stroke-linecap="round"/>`;
  }
  f+=`<ellipse cx="-27" cy="-175" rx="8" ry="4.5" fill="${C.cheek}" opacity=".8"/><ellipse cx="27" cy="-175" rx="8" ry="4.5" fill="${C.cheek}" opacity=".8"/><circle cx="0" cy="-180" r="1.6" fill="#e3a38c"/>`;
  if(mouth==='sing'||mouth==='belt'){const op=(mouth==='belt'?6:3)+Math.abs(Math.sin(t*6))*5;f+=`<ellipse cx="0" cy="-166" rx="${mouth==='belt'?8:6}" ry="${n1(op)}" fill="#c9485f"/><ellipse cx="0" cy="${n1(-166+op*.45)}" rx="4" ry="${n1(op*.35)}" fill="#f08a9a"/>`;}
  else if(mouth==='flat') f+=`<path d="M-6,-167 H6" stroke="#c9485f" stroke-width="2.6" stroke-linecap="round"/>`;
  else f+=`<path d="M-7,-169 q7,7 14,0" stroke="#c9485f" stroke-width="2.8" fill="none" stroke-linecap="round"/>`;
  return `<g transform="translate(${n1(x)},${n1(y+bob)}) scale(${s})">${f}</g>`;
}
function andreas(x,y,s=1,o={}){
  const {t=0,mouth='grin',armL=12,armR=-12,thumbL=false,thumbR=false,wink=false,sweat=false,glassTilt=0,eyesClosed=false,hideR=false,bob=0}=o;
  let f=`<rect x="-15" y="-44" width="10" height="34" rx="5" fill="${C.skinA}"/><rect x="5" y="-44" width="10" height="34" rx="5" fill="${C.skinA}"/>`;
  f+=`<ellipse cx="-11" cy="-8" rx="12" ry="7.5" fill="#1d2440"/><ellipse cx="11" cy="-8" rx="12" ry="7.5" fill="#1d2440"/>`;

/* ---------- timeline ---------- */
let acc=0;SCENES.forEach(sc=>{sc.start=acc;acc+=sc.dur;});
const TOTAL=acc;
const LINES=[];SCENES.forEach(sc=>sc.caps.forEach(([st,tx])=>{if(!tx.startsWith('♪'))LINES.push({t:sc.start+st,text:tx,scene:sc.name});}));
const svg=document.getElementById('stage'),cap=document.getElementById('cap'),prog=document.getElementById('prog'),bar=document.getElementById('bar'),timeEl=document.getElementById('time');
const playBtn=document.getElementById('play'),big=document.getElementById('bigplay'),restartBtn=document.getElementById('restart'),muteBtn=document.getElementById('mute'),lyr=document.getElementById('lyr');
const SECS=[['Chorus',0],['Verse 1',2],['Chorus',6],['Verse 2',8],['Verse 3',12],['Big finish',16]];
const lineBtns=[];
LINES.forEach((l,i)=>{const sec=SECS.find(s=>s[1]===i);if(sec){const h=document.createElement('li');h.className='sec';h.textContent=sec[0];lyr.appendChild(h);}
  const li=document.createElement('li'),b=document.createElement('button');b.type='button';b.textContent=l.text;b.addEventListener('click',()=>{T=l.t+.01;render();});li.appendChild(b);lyr.appendChild(li);lineBtns.push(b);});
const fmt=s=>Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0');
let T=1.3, playing=false, last=0, curLine=-2;
function render(){
  let i=SCENES.findIndex(sc=>T<sc.start+sc.dur);if(i<0)i=SCENES.length-1;
  const sc=SCENES[i], lt=T-sc.start;
  svg.innerHTML=DEFS+sc.draw(lt);
  let c='';for(const [st,tx] of sc.caps) if(lt>=st) c=tx;
  if(cap.textContent!==c) cap.textContent=c;
  prog.style.width=(T/TOTAL*100).toFixed(2)+'%';bar.setAttribute('aria-valuenow',Math.round(T/TOTAL*100));
  timeEl.textContent=fmt(T)+' / '+fmt(TOTAL);
  let li=-1;LINES.forEach((l,k)=>{if(T>=l.t)li=k;});
  if(li!==curLine){lineBtns.forEach((b,k)=>b.classList.toggle('on',k===li));curLine=li;}
}
function loop(now){if(!playing)return;const dt=Math.min(.1,(now-last)/1000);last=now;T+=dt;if(T>=TOTAL){T=TOTAL-.001;render();setPlaying(false);return;}render();requestAnimationFrame(loop);}
function setPlaying(p){playing=p;playBtn.textContent=p?'Pause':'Play';big.hidden=p;if(p){if(T>=TOTAL-.01)T=0;last=performance.now();requestAnimationFrame(loop);startMusic();}else stopMusic();}
playBtn.addEventListener('click',()=>setPlaying(!playing));
big.addEventListener('click',()=>{if(T>=TOTAL-.01||T<3.5&&!playing)T=0;setPlaying(true);});
restartBtn.addEventListener('click',()=>{T=0;render();if(!playing)setPlaying(true);});
function seekFrom(x){const r=bar.getBoundingClientRect();T=clamp((x-r.left)/r.width)*TOTAL*.9999;render();}
bar.addEventListener('click',e=>seekFrom(e.clientX));
bar.addEventListener('keydown',e=>{if(e.key==='ArrowRight'){T=Math.min(TOTAL-.01,T+3);render();}if(e.key==='ArrowLeft'){T=Math.max(0,T-3);render();}});

/* ---------- music: an original ukulele strum ---------- */
let actx=null,master=null,timer=null,nextNote=0,beat=0,musicOn=true;
const BPM=104,PROG=[[60,64,67],[55,59,62],[57,60,64],[53,57,60]],MEL=[[76,79,76,72],[74,79,77,74],[76,72,74,76],[72,69,72,74]];
const mtof=m=>440*Math.pow(2,(m-69)/12);
function tone(time,m,vel,dur,type='triangle',cut=2800){const o=actx.createOscillator(),g=actx.createGain(),f=actx.createBiquadFilter();o.type=type;o.frequency.value=mtof(m);f.type='lowpass';f.frequency.setValueAtTime(cut,time);f.frequency.exponentialRampToValueAtTime(500,time+dur);g.gain.setValueAtTime(.0001,time);g.gain.exponentialRampToValueAtTime(vel,time+.006);g.gain.exponentialRampToValueAtTime(.0001,time+dur);o.connect(f);f.connect(g);g.connect(master);o.start(time);o.stop(time+dur+.05);}
function whistle(time,m,dur){const o=actx.createOscillator(),g=actx.createGain(),v=actx.createOscillator(),vg=actx.createGain();o.type='sine';o.frequency.value=mtof(m+12);v.frequency.value=5.5;vg.gain.value=6;v.connect(vg);vg.connect(o.frequency);g.gain.setValueAtTime(.0001,time);g.gain.exponentialRampToValueAtTime(.035,time+.05);g.gain.setValueAtTime(.035,time+dur*.7);g.gain.exponentialRampToValueAtTime(.0001,time+dur);o.connect(g);g.connect(master);o.start(time);v.start(time);o.stop(time+dur+.05);v.stop(time+dur+.05);}
function schedule(){const e=60/BPM/2;while(nextNote<actx.currentTime+.25){const bar8=Math.floor(beat/8)%4, ch=PROG[bar8], k=beat%8, pat=[1,0,1,1,0,1,1,1];
  if(pat[k]){const down=k%2===0;(down?ch:[...ch].reverse()).forEach((m,i)=>tone(nextNote+i*.014,m+12,.055,.7));}
  if(k===0||k===4) tone(nextNote,ch[0]-12,.12,.9,'triangle',900);
  if(k%2===0 && Math.floor(beat/32)%2===1) whistle(nextNote,MEL[bar8][k/2],e*1.8);
  nextNote+=e;beat++;}}
function startMusic(){if(!musicOn)return;try{if(!actx){const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;actx=new AC();master=actx.createGain();master.connect(actx.destination);}actx.resume();master.gain.cancelScheduledValues(actx.currentTime);master.gain.setValueAtTime(.9,actx.currentTime);nextNote=actx.currentTime+.05;clearInterval(timer);timer=setInterval(schedule,60);}catch(e){}}
function stopMusic(){clearInterval(timer);timer=null;if(actx&&master){master.gain.setTargetAtTime(.0001,actx.currentTime,.05);}}
muteBtn.addEventListener('click',()=>{musicOn=!musicOn;muteBtn.textContent=musicOn?'Music on':'Music off';muteBtn.setAttribute('aria-pressed',String(!musicOn));if(!musicOn)stopMusic();else if(playing)startMusic();});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&playing)setPlaying(false);});
render();
})();
